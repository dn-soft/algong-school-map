name: Rebuild school map

on:
  schedule:
    # 매일 KST 03:00 (UTC 18:00 전날)
    - cron: '0 18 * * *'
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build
        env:
          MONGO_API_KEY: ${{ secrets.MONGO_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python3 build.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html coords_cache.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: auto-rebuild map $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
